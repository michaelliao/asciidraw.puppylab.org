<!DOCTYPE html>
<html class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Draw</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1"></script>
    <script src="https://unpkg.com/lucide@0.563.0/dist/umd/lucide.min.js"></script>
    <script src="https://unpkg.com/vue@3.5.27/dist/vue.global.js"></script>
    <style>
        @font-face {
            font-family: "maple-mono";
            src: url("MapleMono.woff2");
        }

        :root {
            --canvas-bg: #121212;
            --sidebar-bg: #1e1e1e;
            --scrollbar-track: transparent;
            /* 轨道透明，更现代 */
            --scrollbar-thumb: #3f3f3f;
            --scrollbar-thumb-hover: #555;
            --scrollbar-border: #1e1e1e;
            /* 侧边栏背景色，用于滑块边框 */
            --scrollbar-size: 8px;
            /* 侧边栏滚动条稍微细一点 */

            /* 必须与 JS 中的 CHAR_W, CHAR_H 保持绝对一致 */
            --grid-w: 9.6px;
            /* Maple Mono 16px 的近似宽度 */
            --grid-h: 24px;
            /* 行高 */
            --grid-color: rgba(255, 255, 255, 0.05);
            /* 暗灰色网格线 */
        }

        /* 定义通用自定义滚动条类 */
        .scrollbar-styled::-webkit-scrollbar {
            width: var(--scrollbar-size);
            height: var(--scrollbar-size);
        }

        .scrollbar-styled::-webkit-scrollbar-track {
            background: var(--scrollbar-track);
        }

        .scrollbar-styled::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border: 2px solid var(--scrollbar-border);
            /* 这里的颜色要动态适配背景 */
            border-radius: 10px;
        }

        .scrollbar-styled::-webkit-scrollbar-thumb:hover {
            background: var(--scrollbar-thumb-hover);
        }

        .scrollbar-styled::-webkit-scrollbar-corner {
            background-color: var(--canvas-bg);
        }

        /* 针对中间编辑区的特殊覆盖（因为背景色不同） */
        section.scrollbar-styled {
            --scrollbar-border: #121212;
            /* 匹配编辑区背景 */
            --scrollbar-size: 12px;
            /* 编辑区滚动条大一点，好操作 */
        }

        /* 字符网格背景 */
        #canvas-container {
            background-image:
                linear-gradient(to right, var(--grid-color) 1px, transparent 1px),
                linear-gradient(to bottom, var(--grid-color) 1px, transparent 1px);
            background-size: var(--grid-w) var(--grid-h);
            background-attachment: local;
            /* 随内容滚动 */
        }

        #ascii-container {
            font-family: 'maple-mono';
            font-size: 16px;
            /* 目标字号 */
            line-height: 24px;
            /* 与 --grid-h 保持一致 */
            letter-spacing: 0;
            margin: 0;
            padding: 0;
        }

        body {
            overflow: hidden;
        }

        .selection-box {
            position: absolute;
            border: 1px solid #3b82f6;
            pointer-events: none;
            /* 框本身不挡点击 */
            z-index: 9999;
        }

        .snap-indicator {
            position: absolute;
            pointer-events: none;
            background: rgba(59, 130, 246, 0.4);
            /* 蓝色半透明 */
            border: 2px solid #3b82f6;
            border-radius: 50%;
            transform: scale(1.5);
            /* 稍微比字符大一点点，更有引导感 */
            z-index: 10000;
        }

        .handle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: white;
            border: 1px solid #3b82f6;
            pointer-events: auto !important;
            /* 点可以被点击/拖拽 */
            transform: translate(-50%, -50%);
        }

        /* 专门为中心拖拽点设计的样式 */
        .handle-move {
            left: 50%;
            top: 50%;
            width: 12px;
            /* 稍微大一点，方便抓取 */
            height: 12px;
            cursor: move;
            background: #ff9800;
            /* 换个颜色区分调整大小和移动 */
            border-radius: 50%;
            /* 圆形显得更像是一个“把手” */
        }

        /* 矩形 8 个点的布局 */
        .handle-tl {
            top: 0;
            left: 0;
            cursor: nwse-resize;
        }

        .handle-tc {
            top: 0;
            left: 50%;
            cursor: ns-resize;
        }

        .handle-tr {
            top: 0;
            left: 100%;
            cursor: nesw-resize;
        }

        .handle-ml {
            top: 50%;
            left: 0;
            cursor: ew-resize;
        }

        .handle-mr {
            top: 50%;
            left: 100%;
            cursor: ew-resize;
        }

        .handle-bl {
            top: 100%;
            left: 0;
            cursor: nesw-resize;
        }

        .handle-bc {
            top: 100%;
            left: 50%;
            cursor: ns-resize;
        }

        .handle-br {
            top: 100%;
            left: 100%;
            cursor: nwse-resize;
        }

        /* Line 特殊点位布局 (由 selectionStyle 计算出的绝对位置或偏移) */
        .handle-line-start,
        .handle-line-end {
            border-radius: 50%;
            /* 圆形手柄 */
            width: 10px;
            /* 稍微大一点点，更好抓取 */
            height: 10px;
            cursor: move;
        }
    </style>
    <style type="text/tailwindcss">
        @layer components {
            .toolbar-button {
                @apply px-3 py-1 cursor-pointer rounded text-sm transition bg-zinc-700 hover:bg-zinc-600 text-gray-300 hover:text-gray-100;
            }
    
            .toolbar-button:disabled {
                @apply cursor-default bg-zinc-700 text-gray-600;
            }

            .toolbar-seperator {
                @apply h-6 w-px bg-gray-600 mx-2;
            }
        }
    </style>
</head>

<body id="app" class="h-full w-full bg-[#1a1a1a] text-gray-300 flex flex-col">

    <header class="w-full h-auto flex-none border-b border-gray-700 bg-[#252525] p-2 overflow-hidden whitespace-nowrap">
        <div class="flex items-center gap-2">
            <button title="Open File" class="toolbar-button" @click="openLocalFile">
                <i data-lucide="folder-open" class="w-5 h-5"></i>
            </button>
            <button title="Save File" class="toolbar-button" @click="saveLocalFile" :disabled="!history.isDirty()">
                <i data-lucide="save" class="w-5 h-5"></i>
            </button>
            <button title="Copy to Clipboard" class="toolbar-button bg-blue-600 hover:bg-blue-500"
                @click="copyToClipboard">
                <i data-lucide="clipboard-check" class="w-5 h-5"></i>
            </button>

            <div class="toolbar-seperator"></div>

            <button title="Rect" class="toolbar-button" @click="addShape('rect', {})">
                <i data-lucide="square" class="w-5 h-5"></i>
            </button>
            <button title="Line" class="toolbar-button" @click="addShape('line', {})">
                <i data-lucide="minus" class="w-5 h-5"></i>
            </button>
            <button title="Arrow" class="toolbar-button" @click="addShape('line', {endStyle: 'arrow'})">
                <i data-lucide="arrow-up-right" class="w-5 h-5"></i>
            </button>
            <button title="Text" class="toolbar-button"
                @click="addShape('rect', {transparent:true, text:'Text Box', style:'none'})">
                <i data-lucide="type" class="w-5 h-5"></i>
            </button>

            <div class="toolbar-seperator"></div>

            <button title="Delete" @click="deleteSelectedShape" :disabled="!selectedNodeId"
                :class="['toolbar-button', selectedNodeId ? 'bg-red-600 hover:bg-red-500' : '']">
                <i data-lucide="trash-2" class="w-5 h-5"></i>
            </button>
            <button title="Undo" class="toolbar-button" @click="handleUndo" :disabled="!canUndo">
                <i data-lucide="undo-2" class="w-5 h-5"></i>
            </button>
            <button title="Redo" class="toolbar-button" @click="handleRedo" :disabled="!canRedo">
                <i data-lucide="redo-2" class="w-5 h-5"></i>
            </button>

            <div class="toolbar-seperator"></div>

            <span :class="['transition-colors', history.isDirty() ? 'text-gray-300' : 'text-gray-500']">
                {{ fileName }}{{ history.isDirty() ? '*' : '' }}
            </span>
        </div>
    </header>

    <main class="w-full flex-1 flex overflow-hidden">
        <aside
            class="w-[200px] flex-none border-r border-gray-700 bg-[#1e1e1e] flex flex-col scrollbar-styled overflow-auto">
            <div
                class="sticky top-0 p-2 text-[10px] uppercase tracking-wider text-gray-500 font-bold bg-[#1e1e1e] border-b border-gray-800 z-10">
                Layers</div>
            <ul class="text-xs p-2 space-y-1">
                <li v-for="(node, index) in displayShapes" :key="node.id" @click="selectedNodeId = node.id"
                    draggable="true" @dragstart="handleDragStart(index)" @dragover="handleDragOver"
                    @drop="handleDrop(index)" :class="[
                        'flex items-center gap-2 p-1 cursor-pointer rounded border border-transparent transition-all',
                        selectedNodeId === node.id ? 'bg-blue-600 text-white' : 'hover:bg-gray-800',
                        dragIndex === ((model.shapes.length - 1) - index) ? 'opacity-40 border-dashed border-blue-400' : ''
                    ]">
                    <span v-html="getShapeIcon(node)" class="flex items-center justify-center"></span> {{ node.name }}
                </li>
            </ul>
        </aside>

        <section class="flex-1 bg-[#121212] relative scrollbar-styled overflow-auto" ref="scrollContainer">
            <div id="canvas-container" class="relative bg-[#121212] cursor-default"
                :style="{ width: canvasWidth + 'px', height: canvasHeight + 'px' }" @mousedown="handleCanvasClick">

                <pre id="ascii-container"
                    class="absolute inset-0 pointer-events-none select-none text-white whitespace-pre">{{ screenOutput }}</pre>

                <div class="snap-indicator" :style="snapStyle"></div>

                <div class="selection-box" :style="selectionStyle" v-if="selectedNode">
                    <template v-if="selectedNode.type === 'Rect'">
                        <div v-for="p in ['tl','tc','tr','ml','mr','bl','bc','br', 'move']" :key="p"
                            :class="['handle', 'handle-' + p]" @mousedown.stop="handleResizeStart($event, p)">
                        </div>
                    </template>
                    <div v-if="selectedNode.type === 'Line'">
                        <div v-for="(pos, index) in handlePositions" :key="index"
                            :class="['handle', index === 0 ? 'handle-line-start' : 'handle-line-end']"
                            :style="{ left: pos.left, top: pos.top }"
                            @mousedown.stop="handleResizeStart($event, index === 0 ? 'start' : 'end')">
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <aside
            class="w-[250px] flex-none border-l border-gray-700 bg-[#1e1e1e] flex flex-col scrollbar-styled overflow-auto">
            <div
                class="sticky top-0 p-2 text-[10px] uppercase tracking-wider text-gray-500 font-bold bg-[#1e1e1e] border-b border-gray-800 z-10">
                Props
            </div>

            <div v-if="selectedNode" class="p-4 space-y-4">
                <!-- 属性编辑区 -->
                <div v-for="item in selectedNode.getEditables()" :key="item.propName">
                    <label class="block text-[10px] text-gray-500 mb-1 uppercase font-semibold">{{ item.name }}</label>

                    <input v-if="item.type === 'text'" type="text" maxlength="50" v-model="selectedNode[item.propName]"
                        @focus="history.save()" @change="history.save()"
                        class="w-full bg-[#333] border border-gray-600 rounded px-2 py-1 text-xs text-white focus:border-blue-500 outline-none">

                    <textarea v-else-if="item.type === 'textarea'" rows="7" v-model="selectedNode[item.propName]"
                        @focus="history.save()" @change="history.save()"
                        class="w-full bg-[#333] border border-gray-600 rounded px-2 py-1 text-xs text-white focus:border-blue-500 outline-none resize-none"></textarea>

                    <div v-else-if="item.type === 'checkbox'" @click="history.save()" class="flex items-center">
                        <input type="checkbox" v-model="selectedNode[item.propName]"
                            class="w-4 h-4 accent-blue-600 cursor-pointer">
                        <span class="ml-2 text-xs text-gray-400">Enabled</span>
                    </div>

                    <select v-else-if="item.type === 'select'" v-model="selectedNode[item.propName]"
                        @mousedown="history.save()" @change="history.save()"
                        class="w-full bg-[#333] border border-gray-600 rounded px-2 py-1 text-xs text-white focus:border-blue-500 outline-none cursor-pointer">
                        <option v-for="opt in item.enums" :key="opt" :value="opt">
                            {{ opt.charAt(0).toUpperCase() + opt.slice(1) }}
                        </option>
                    </select>
                </div>
            </div>

            <div v-else
                class="flex flex-col items-center justify-center h-full text-gray-600 italic text-xs p-10 text-center">
                Select a shape on the canvas to edit its properties
            </div>
        </aside>
    </main>

    <footer
        class="w-full h-auto flex-none border-t border-gray-700 bg-[#252525] px-3 py-1 overflow-hidden whitespace-nowrap text-xs text-gray-400">
        <div class="flex justify-between items-center">
            <div class="truncate">
                <span>Selection: {{ selectedNode ? selectedNode.toString() : 'None' }}</span>
            </div>
            <div class="flex-none ml-4 font-mono">
                <span>Grid: {{ currentGrid.x }}, {{ currentGrid.y }}</span> | ASCII Mode | <a target="_blank" href="https://github.com/michaelliao/asciidraw.puppylab.org" class="text-blue-400">GitHub</a>
            </div>
        </div>
    </footer>

    <script src="main.js"></script>
</body>

</html>
